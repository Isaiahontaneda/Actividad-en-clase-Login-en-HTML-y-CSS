<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login AdminExpress</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <main class="contenedor">

        <section class="panel-azul">
            <h1>AdminExpress</h1>
        </section>

        <section class="panel-login">
            <div class="caja-login">

                <h2>Let's <strong>Sign In</strong></h2>
                <p class="subtitulo">Hey, Enter your details to get sign in to your account.</p>

                <div class="formulario">

                    <div class="grupo">
                        <p class="etiqueta">Email</p>
                        <div class="campo">Enter Email</div>
                    </div>

                    <div class="grupo">
                        <p class="etiqueta">Password</p>
                        <div class="campo">Enter Password</div>
                    </div>

                    <p class="olvido">Forgot password?</p>

                    <div class="boton">Sign In</div>

                    <p class="registro">Don't have an account? <span>Sign Up</span></p>

                </div>

            </div>
        </section>

    </main>
</body>

</html>
